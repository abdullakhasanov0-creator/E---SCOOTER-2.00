name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Find project
        id: find
        run: |
          echo "== files in repo =="
          find . -not -path './.git/*' -type f | head -40 || true
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts not found - project files are not in the repository"
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: E-scooter-App-2.2
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/release/*.apk
